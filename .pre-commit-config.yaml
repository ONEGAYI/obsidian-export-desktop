# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 38b88246ccc552bffaaf54259d064beeee434539 # frozen: v4.0.1
    hooks:
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: '^(README.md|tests/testdata/expected/.*)$'
  - repo: local
    hooks:
      - id: rustfmt
        name: Check formatting
        # Pinned dated nightly, same as the fmt job in ci.yml and the `fmt`
        # target in the Justfile (a bare `nightly` drifts with rustfmt
        # releases). `just fmt` installs the toolchain locally.
        entry: cargo +nightly-2026-08-20 fmt --
        language: system
        files: \.rs$
      - id: tests
        name: Run tests
        entry: cargo test --all-targets --all-features
        language: system
        files: \.rs$
        pass_filenames: false
      - id: clippy
        name: Check clippy lints
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false
