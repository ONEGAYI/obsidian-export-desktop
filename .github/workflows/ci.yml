name: CI tests
on: [push]

jobs:
  populate-rust-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: ./.github/actions/setup-ci
        with:
          rust-cache-shared-key: "base"
      - run: cargo check --all-targets --all-features
        continue-on-error: true

  rust-jobs:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    needs: populate-rust-cache
    strategy:
      matrix:
        job:
          # The formatting nightly is pinned to a dated toolchain: a bare
          # `nightly` drifts as rustfmt evolves and would reformat the repo
          # from under us. Keep in sync with the `fmt` target in the Justfile
          # and the rustfmt hook in .pre-commit-config.yaml; to upgrade,
          # bump the date everywhere and reformat in the same commit.
          - rustup toolchain install nightly-2026-08-20 --profile minimal --component rustfmt && cargo +nightly-2026-08-20 fmt --all -- --check
          - cargo test --all-targets --all-features
          - cargo clippy --all-targets --all-features -- -D warnings
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: ./.github/actions/setup-ci
        with:
          rust-cache-shared-key: "base"
      - run: ${{ matrix.job }}

  deny:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        job:
          - cargo deny --all-features check advisories
          - cargo deny --all-features check bans licenses sources
      fail-fast: false
    # Prevent sudden announcement of a new advisory from failing CI:
    continue-on-error: ${{ endsWith(matrix.job, 'check advisories') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: ./.github/actions/cargo-binstall
        with:
          binstall: "cargo-deny"
      - run: ${{ matrix.job }}

  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    needs: populate-rust-cache
    env:
      # These hooks are expensive and already run as dedicated jobs above
      SKIP: "rustfmt,tests,clippy"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: ./.github/actions/setup-ci
        with:
          rust-cache-shared-key: "base"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      - name: set PYVERSION
        run: echo "PYVERSION=$(python --version | tr ' ' '-')" >> $GITHUB_ENV

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/pre-commit
          # Changes to pre-commit-config.yaml may require the installation of
          # new binaries/scripts. When a cache hit occurs, changes to the cache
          # aren't persisted at the end of the run, so making the key dependent
          # on the configuration file ensures we always persist a complete cache.
          key: pre-commit-${{ env.PYVERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit
      - run: pre-commit run --all --color=always --show-diff-on-failure

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - run: git config --system core.autocrlf false && git config --system core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: ./.github/actions/setup-ci
      - run: cargo test

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    needs: populate-rust-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: ./.github/actions/setup-ci
      - uses: ./.github/actions/cargo-binstall
        with:
          binstall: "cargo-tarpaulin"
      - run: cargo tarpaulin --out Html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tarpaulin-report
          path: tarpaulin-report.html

  desktop:
    name: Desktop app (typecheck, unit tests, rust tests)
    runs-on: windows-latest
    steps:
      - run: git config --system core.autocrlf false && git config --system core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install rust toolchain
        shell: bash
        run: rustup show
      # Cache both target dirs: the repo root (sidecar build) and the
      # desktop workspace, which the root's automatic caching cannot see.
      # No "-> crate" suffix here: the right-hand side of the arrow names
      # the target directory inside the workspace (default "target"), not
      # the crate — pointing it at the crate name would silently cache a
      # nonexistent path.
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
      - run: pnpm -C desktop install --frozen-lockfile
      # Hard ordering constraint: the desktop build script verifies the
      # externalBin binary at compile time and binaries/ is gitignored, so
      # the sidecar must be built into place before anything else runs.
      - run: pnpm -C desktop run sync-sidecar
      - run: pnpm -C desktop run build
      - run: pnpm -C desktop test
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
