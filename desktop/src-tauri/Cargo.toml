[package]
name = "obsidian-export-desktop"
version = "26.8.4"
description = "Desktop GUI for obsidian-export (sidecar architecture)"
edition = "2021"

# The repository root pins the Rust toolchain via rust-toolchain.toml, which
# cascades into this crate; .cargo/config.toml additionally keeps dependency
# versions MSRV-compatible with it. This crate is its own workspace root so the
# CLI crate and its release pipelines stay untouched.
[workspace]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to only be an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
